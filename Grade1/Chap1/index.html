<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer: A Smart Machine -  ICT</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#dff6ff,#fff7cc,#f3e8ff);
overflow-x:hidden;
overflow-y:auto;
min-height:100vh;
color:#222;
}

.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:0;
pointer-events:none;
}

.star{
position:absolute;
width:5px;
height:5px;
background:white;
border-radius:50%;
opacity:0.8;
animation:floatStars linear infinite;
}

@keyframes floatStars{
0%{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

.screen{
display:none;
position:relative;
z-index:2;
min-height:100vh;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.active{
display:flex;
flex-direction:column;
}

.card{
background:#ffffff;
padding:24px;
border-radius:22px;
max-width:820px;
width:100%;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
border:2px solid #dbe9ff;
}

.logo-screen{
background:white;
}

.logo-screen img{
width:190px;
max-width:85%;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.06);}
100%{transform:scale(1);}
}

h1{
color:#1565c0;
margin-bottom:10px;
}

.info{
margin:8px 0;
font-size:1rem;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:18px;
font-weight:bold;
font-size:1rem;
gap:10px;
}

.question{
font-size:1.15rem;
line-height:1.6;
font-weight:600;
color:#1b1b1b;
margin-bottom:20px;
}

.options{
display:grid;
gap:12px;
}

.option-btn{
padding:14px;
border:none;
border-radius:14px;
background:#eef6ff;
cursor:pointer;
font-size:1rem;
transition:0.3s;
color:#111;
font-weight:500;
}

.option-btn:hover{
background:#d8ecff;
transform:scale(1.02);
}

.correct{
background:#d4ffd4 !important;
border:2px solid #2e7d32;
}

.wrong{
background:#ffd9d9 !important;
border:2px solid #c62828;
}

.feedback{
margin-top:15px;
font-weight:bold;
min-height:28px;
}

.explanation{
margin-top:12px;
background:#eef7ff;
padding:12px;
border-radius:12px;
display:none;
font-size:0.95rem;
line-height:1.5;
}

.main-btn{
padding:12px 24px;
margin-top:18px;
border:none;
background:#1565c0;
color:white;
font-size:1rem;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.main-btn:hover{
background:#0d47a1;
}

.confetti{
position:fixed;
width:14px;
height:14px;
background:gold;
clip-path:polygon(
50% 0%,
61% 35%,
98% 35%,
68% 57%,
79% 91%,
50% 70%,
21% 91%,
32% 57%,
2% 35%,
39% 35%
);
animation:fall 1.5s linear forwards;
z-index:999;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(500px) rotate(360deg);
opacity:0;
}
}

.cross{
position:fixed;
font-size:42px;
color:red;
animation:fade 1s forwards;
z-index:999;
}

@keyframes fade{
0%{
opacity:1;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(2);
}
}

.badge{
font-size:2.2rem;
margin:15px 0;
}

@media(max-width:600px){

.question{
font-size:1rem;
}

.option-btn{
font-size:0.95rem;
padding:12px;
}

h1{
font-size:1.5rem;
}

.topbar{
font-size:0.9rem;
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="background" id="background"></div>

<!-- LOGO SCREEN -->

<div class="screen active logo-screen" id="logoScreen">

<img src="assets/innovine-logo.png" alt="Innovine Logo">

</div>

<!-- INTRO SCREEN -->

<div class="screen" id="introScreen">

<div class="card">

<h1>Computer: A Smart Machine</h1>

<p class="info">ICT</p>

<p class="info"><strong>Topic:</strong> Computer: A Smart Machine</p>

<p class="info"><strong>Total Questions:</strong> 15</p>

<p style="margin-top:15px;">
Answer the questions and learn how computers help us in daily life.
</p>

<button class="main-btn" onclick="startQuiz()">
Start Quiz
</button>

</div>

</div>

<!-- QUIZ SCREEN -->

<div class="screen" id="quizScreen">

<div class="card">

<div class="topbar">

<div id="scoreText">Score: 0</div>

<div id="timerText">Time: 60</div>

</div>

<div class="question" id="questionText"></div>

<div class="options" id="optionsContainer"></div>

<div class="feedback" id="feedback"></div>

<div class="explanation" id="explanation"></div>

</div>

</div>

<!-- RESULT SCREEN -->

<div class="screen" id="resultScreen">

<div class="card">

<h1>Quiz Completed!</h1>

<div class="badge">🏆</div>

<h2 id="finalScore"></h2>

<p id="message"></p>

<button class="main-btn" onclick="restartQuiz()">
Play Again
</button>

</div>

</div>

<!-- AUDIO -->

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

// QUESTIONS

let questions = [

{
question:"Riya uses a computer to draw pictures. What does this show?",
options:[
"Computer helps in drawing",
"Computer cooks food",
"Computer washes clothes",
"Computer drives buses"
],
answer:0,
explanation:"Computers can be used for drawing and coloring."
},

{
question:"Aarav watches cartoons on a computer. What can we learn from this?",
options:[
"Computers can show videos",
"Computers can fly",
"Computers can swim",
"Computers can plant trees"
],
answer:0,
explanation:"Computers help us watch videos and cartoons."
},

{
question:"A teacher uses a computer to show lessons in class. Why is the computer useful?",
options:[
"It helps students learn",
"It cleans the classroom",
"It rings the school bell",
"It packs school bags"
],
answer:0,
explanation:"Computers are useful for learning and teaching."
},

{
question:"Meera listens to songs on a computer. Which feature is being used?",
options:[
"Sound",
"Smell",
"Taste",
"Touch"
],
answer:0,
explanation:"Computers can play sound and music."
},

{
question:"A computer helps a doctor keep patient records. What does this show?",
options:[
"Computers store information",
"Computers cook food",
"Computers grow plants",
"Computers stitch clothes"
],
answer:0,
explanation:"Computers can store large amounts of information."
},

{
question:"Which machine is called a smart machine?",
options:[
"Computer",
"Fan",
"Table",
"Bottle"
],
answer:0,
explanation:"A computer is called a smart machine."
},

{
question:"A child uses a computer to play games and learn numbers. What does this show?",
options:[
"Computers help in learning and fun",
"Computers make rain",
"Computers wash cars",
"Computers paint houses"
],
answer:0,
explanation:"Computers can be used for both learning and entertainment."
},

{
question:"Assertion: Computers can work very fast. Reason: Computers take many hours to solve simple sums.",
options:[
"Assertion is true and reason is false",
"Assertion is false and reason is true",
"Both are true",
"Both are false"
],
answer:0,
explanation:"Computers work very fast and solve sums quickly."
},

{
question:"Assertion: Computers can store information. Reason: Computers forget everything quickly.",
options:[
"Assertion is true and reason is false",
"Assertion is false and reason is true",
"Both are true",
"Both are false"
],
answer:0,
explanation:"Computers can store information safely."
},

{
question:"A student wants to type homework neatly. Which machine can help?",
options:[
"Computer",
"Chair",
"Bottle",
"Clock"
],
answer:0,
explanation:"Computers help in typing neatly."
},

{
question:"A shopkeeper uses a computer to make bills. Why?",
options:[
"Computers work quickly",
"Computers can dance",
"Computers can jump",
"Computers can sing loudly"
],
answer:0,
explanation:"Computers help in fast calculations and billing."
},

{
question:"Which activity can be done on a computer?",
options:[
"Drawing pictures",
"Cooking food",
"Washing clothes",
"Growing trees"
],
answer:0,
explanation:"Computers can be used for drawing and creative work."
},

{
question:"A computer helps us learn ABC and numbers through games. What is this called?",
options:[
"Learning",
"Sleeping",
"Cooking",
"Cleaning"
],
answer:0,
explanation:"Computers are useful learning tools."
},

{
question:"Assertion: Computers can play music. Reason: Computers have no sound feature.",
options:[
"Assertion is true and reason is false",
"Assertion is false and reason is true",
"Both are true",
"Both are false"
],
answer:0,
explanation:"Computers can play songs and sounds."
},

{
question:"Why do people call a computer a smart machine?",
options:[
"It works fast and helps in many tasks",
"It can eat food",
"It can sleep",
"It can swim"
],
answer:0,
explanation:"Computers are smart because they help us do many tasks quickly."
}

];

// FISHER-YATES SHUFFLE
// Randomizes question order every time
// :contentReference[oaicite:0]{index=0}

function shuffleQuestions(array){

for(let i = array.length - 1; i > 0; i--){

const j = Math.floor(Math.random() * (i + 1));

[array[i], array[j]] = [array[j], array[i]];

}

return array;

}

let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 60;
let retryUsed = false;

const logoScreen = document.getElementById("logoScreen");
const introScreen = document.getElementById("introScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const questionText = document.getElementById("questionText");
const optionsContainer = document.getElementById("optionsContainer");
const scoreText = document.getElementById("scoreText");
const timerText = document.getElementById("timerText");
const feedback = document.getElementById("feedback");
const explanation = document.getElementById("explanation");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

// SHOW LOGO FOR 5 SECONDS

setTimeout(()=>{

logoScreen.classList.remove("active");

introScreen.classList.add("active");

},5000);

// START QUIZ

function startQuiz(){

questions = shuffleQuestions(questions);

introScreen.classList.remove("active");
introScreen.style.display = "none";

quizScreen.classList.add("active");
quizScreen.style.display = "flex";

currentQuestion = 0;
score = 0;

loadQuestion();

}

// LOAD QUESTION

function loadQuestion(){

clearInterval(timer);

retryUsed = false;

feedback.innerHTML = "";

explanation.style.display = "none";

const q = questions[currentQuestion];

questionText.innerHTML =
`Q${currentQuestion+1}. ${q.question}`;

optionsContainer.innerHTML = "";

q.options.forEach((option,index)=>{

const btn = document.createElement("button");

btn.classList.add("option-btn");

btn.innerText = option;

btn.onclick = ()=>checkAnswer(index,btn);

optionsContainer.appendChild(btn);

});

scoreText.innerHTML = `Score: ${score}`;

timeLeft = 60;

timerText.innerHTML = `Time: ${timeLeft}`;

timer = setInterval(()=>{

timeLeft--;

timerText.innerHTML = `Time: ${timeLeft}`;

if(timeLeft<=0){

clearInterval(timer);

showCorrectAnswer();

}

},1000);

}

// CHECK ANSWER

function checkAnswer(selected,button){

const q = questions[currentQuestion];

const buttons = document.querySelectorAll(".option-btn");

if(selected === q.answer){

clearInterval(timer);

button.classList.add("correct");

feedback.innerHTML = "✅ Correct!";

feedback.style.color = "green";

correctSound.play();

score++;

createConfetti();

buttons.forEach(btn=>btn.disabled=true);

setTimeout(()=>{

nextQuestion();

},1500);

}else{

button.classList.add("wrong");

wrongSound.play();

showCross();

if(!retryUsed){

retryUsed = true;

feedback.innerHTML =
"❌ Try Again! One more chance.";

feedback.style.color = "#c62828";

buttons.forEach(btn=>{
btn.disabled = false;
});

button.disabled = true;

}else{

clearInterval(timer);

showCorrectAnswer();

}

}

}

// SHOW CORRECT ANSWER

function showCorrectAnswer(){

const q = questions[currentQuestion];

const buttons =
document.querySelectorAll(".option-btn");

buttons.forEach((btn,index)=>{

btn.disabled = true;

if(index === q.answer){

btn.classList.add("correct");

}

});

feedback.innerHTML = "Correct answer shown";

feedback.style.color = "#1565c0";

explanation.style.display = "block";

explanation.innerHTML =
`💡 ${q.explanation}`;

setTimeout(()=>{

nextQuestion();

},4000);

}

// NEXT QUESTION

function nextQuestion(){

currentQuestion++;

if(currentQuestion < questions.length){

loadQuestion();

}else{

showResult();

}

}

// SHOW RESULT

function showResult(){

quizScreen.classList.remove("active");

quizScreen.style.display = "none";

resultScreen.classList.add("active");

resultScreen.style.display = "flex";

document.getElementById("finalScore").innerHTML =
`Your Score: ${score} / ${questions.length}`;

let msg = "";

if(score >= 13){

msg = "Excellent Work!";

}else if(score >= 9){

msg = "Very Good Job!";

}else{

msg = "Good Try! Keep Practicing.";

}

document.getElementById("message").innerHTML = msg;

window.scrollTo({
top:0,
behavior:"smooth"
});

}

// RESTART QUIZ

function restartQuiz(){

questions = shuffleQuestions(questions);

currentQuestion = 0;

score = 0;

resultScreen.classList.remove("active");

resultScreen.style.display = "none";

introScreen.classList.add("active");

introScreen.style.display = "flex";

}

// CONFETTI

function createConfetti(){

for(let i=0;i<20;i++){

const confetti = document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left =
Math.random()*window.innerWidth + "px";

confetti.style.top =
Math.random()*200 + "px";

document.body.appendChild(confetti);

setTimeout(()=>{

confetti.remove();

},1500);

}

}

// WRONG CROSS

function showCross(){

const cross = document.createElement("div");

cross.classList.add("cross");

cross.innerHTML = "✖";

cross.style.left =
Math.random()*window.innerWidth + "px";

cross.style.top =
Math.random()*window.innerHeight + "px";

document.body.appendChild(cross);

setTimeout(()=>{

cross.remove();

},1000);

}

// BACKGROUND ANIMATION

function createBackground(){

const bg = document.getElementById("background");

for(let i=0;i<40;i++){

const star = document.createElement("div");

star.classList.add("star");

star.style.left = Math.random()*100 + "%";

star.style.animationDuration =
(5 + Math.random()*8) + "s";

star.style.animationDelay =
Math.random()*5 + "s";

bg.appendChild(star);

}

}

createBackground();

</script>

</body>
</html>
