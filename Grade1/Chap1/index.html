<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer: A Smart Machine</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#dff6ff,#fff8d9,#f4eaff);
overflow-x:hidden;
min-height:100vh;
color:#222;
}

.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:0;
pointer-events:none;
}

.star{
position:absolute;
width:5px;
height:5px;
background:white;
border-radius:50%;
opacity:0.7;
animation:floatStars linear infinite;
}

@keyframes floatStars{
0%{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

.screen{
display:none;
position:relative;
z-index:2;
min-height:100vh;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.active{
display:flex;
flex-direction:column;
}

.card{
background:#ffffff;
padding:22px;
border-radius:20px;
max-width:850px;
width:100%;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
border:2px solid #dbe9ff;
}

.logo-screen{
background:white;
}

.logo-screen img{
width:180px;
max-width:80%;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

h1{
color:#1565c0;
margin-bottom:10px;
}

.info{
margin:8px 0;
font-size:1rem;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:15px;
font-weight:bold;
font-size:1rem;
gap:10px;
flex-wrap:wrap;
}

.question{
font-size:1.15rem;
line-height:1.6;
font-weight:600;
color:#1b1b1b;
margin-bottom:20px;
}

.options{
display:grid;
gap:12px;
}

.option-btn{
padding:14px;
border:none;
border-radius:12px;
background:#eef6ff;
cursor:pointer;
font-size:1rem;
transition:0.3s;
color:#111;
font-weight:500;
}

.option-btn:hover{
background:#d8ecff;
transform:scale(1.02);
}

.correct{
background:#d4ffd4 !important;
border:2px solid #2e7d32;
}

.wrong{
background:#ffd9d9 !important;
border:2px solid #c62828;
}

.feedback{
margin-top:15px;
font-weight:bold;
min-height:28px;
}

.explanation{
margin-top:12px;
background:#eef7ff;
padding:12px;
border-radius:12px;
display:none;
font-size:0.95rem;
line-height:1.5;
}

.main-btn{
padding:12px 24px;
margin-top:18px;
border:none;
background:#1565c0;
color:white;
font-size:1rem;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.main-btn:hover{
background:#0d47a1;
}

.confetti{
position:fixed;
width:14px;
height:14px;
background:gold;
clip-path:polygon(
50% 0%,
61% 35%,
98% 35%,
68% 57%,
79% 91%,
50% 70%,
21% 91%,
32% 57%,
2% 35%,
39% 35%
);
animation:fall 1.5s linear forwards;
z-index:999;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(500px) rotate(360deg);
opacity:0;
}
}

.cross{
position:fixed;
font-size:40px;
color:red;
animation:fade 1s forwards;
z-index:999;
}

@keyframes fade{
0%{
opacity:1;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(2);
}
}

.result-score{
font-size:2rem;
margin:15px 0;
color:#1565c0;
font-weight:bold;
}

@media(max-width:600px){

.question{
font-size:1rem;
}

.option-btn{
font-size:0.95rem;
padding:12px;
}

h1{
font-size:1.6rem;
}

.topbar{
font-size:0.9rem;
}

}

</style>
</head>

<body>

<div class="background" id="background"></div>

<!-- LOGO SCREEN -->

<div class="screen active logo-screen" id="logoScreen">

<img src="assets/innovine-logo.png" alt="Innovine Logo">

<h2 style="margin-top:20px;">
Innovine Interactive Learning
</h2>

</div>

<!-- INTRO SCREEN -->

<div class="screen" id="introScreen">

<div class="card">

<h1>Computer: A Smart Machine</h1>

<p class="info"><strong>Grade:</strong> 1</p>

<p class="info"><strong>Subject:</strong> ICT</p>

<p class="info"><strong>Topic:</strong> Computer: A Smart Machine</p>

<p class="info"><strong>Total Questions:</strong> 15</p>

<p style="margin-top:15px;">
Answer the competency-based questions and learn how computers help us in daily life.
</p>

<button class="main-btn" onclick="startQuiz()">
Start Quiz
</button>

</div>

</div>

<!-- QUIZ SCREEN -->

<div class="screen" id="quizScreen">

<div class="card">

<div class="topbar">

<div id="progressText">Question 1 / 15</div>

<div id="scoreText">Score: 0</div>

<div id="timerText">Time: 60</div>

</div>

<div class="question" id="questionText"></div>

<div class="options" id="optionsContainer"></div>

<div class="feedback" id="feedback"></div>

<div class="explanation" id="explanation"></div>

</div>

</div>

<!-- RESULT SCREEN -->

<div class="screen" id="resultScreen">

<div class="card">

<h1>Quiz Completed!</h1>

<div class="result-score" id="finalScore"></div>

<p id="message"></p>

<button class="main-btn" onclick="restartQuiz()">
Play Again
</button>

</div>

</div>

<!-- AUDIO -->

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const questions = [

{
question:"Riya wants to listen to music and watch cartoons on a computer. What does this show about a computer?",
options:[
"It can do many types of work",
"It can only type",
"It cannot play music",
"It only draws pictures"
],
answer:0,
explanation:"A computer can perform many different tasks."
},

{
question:"Aarav uses a computer to draw, type and play games. Which feature of the computer is shown here?",
options:[
"Speed",
"Versatility",
"Tiredness",
"Sleeping"
],
answer:1,
explanation:"Versatility means a computer can do different kinds of work."
},

{
question:"A computer in a hospital helps doctors keep records quickly. Why do hospitals use computers?",
options:[
"Computers become sick",
"Computers work slowly",
"Computers help store and manage information",
"Computers only play games"
],
answer:2,
explanation:"Computers help store and manage important records."
},

{
question:"Meera entered the wrong information into the computer. What will the computer do?",
options:[
"Correct it automatically always",
"Give wrong result",
"Stop forever",
"Break down"
],
answer:1,
explanation:"Wrong input gives wrong output."
},

{
question:"A student says computers never get tired even after working for many hours. Which quality is this?",
options:[
"Accuracy",
"Diligence",
"Noise",
"Colouring"
],
answer:1,
explanation:"Diligence means computers can work continuously without getting tired."
},

{
question:"Rahul wants to calculate big sums very fast. Which machine can help him best?",
options:[
"Blackboard",
"Computer",
"Pencil box",
"Chair"
],
answer:1,
explanation:"Computers solve calculations very quickly."
},

{
question:"Ritu uses a computer to attend online classes, draw pictures and solve sums. What can we conclude from this?",
options:[
"Computer does only one job",
"Computer is a smart machine",
"Computer cannot learn",
"Computer works only in schools"
],
answer:1,
explanation:"A computer is called smart because it performs many tasks."
},

{
question:"A shopkeeper uses a computer to make bills quickly every day. Which quality of computer is shown?",
options:[
"Laziness",
"Speed",
"Sleeping",
"Dancing"
],
answer:1,
explanation:"Computers work very fast."
},

{
question:"School → Teaching, Hospital → Patient records, Bank → Money records. Where are computers used to keep money records?",
options:[
"School",
"Bank",
"Park",
"Playground"
],
answer:1,
explanation:"Banks use computers to manage money records."
},

{
question:"Computer can draw pictures, play games and store information. Which activity cannot be done by a computer?",
options:[
"Drawing",
"Storing information",
"Eating food",
"Playing games"
],
answer:2,
explanation:"Computers cannot eat food."
},

{
question:"A picture shows a child using a computer to type homework. What is the computer helping the child to do?",
options:[
"Cooking food",
"Writing work neatly",
"Sleeping",
"Washing clothes"
],
answer:1,
explanation:"Computers help children type and write neatly."
},

{
question:"A picture shows computers in a railway station. Why are computers used there?",
options:[
"To fly aeroplanes",
"To manage tickets and information",
"To water plants",
"To clean roads"
],
answer:1,
explanation:"Railway stations use computers to manage ticket information."
},

{
question:"Assertion: A computer is called a smart machine. Reason: It can do many tasks quickly.",
options:[
"Both are true and reason explains assertion",
"Both are true but reason does not explain assertion",
"Assertion is true but reason is false",
"Both are false"
],
answer:0,
explanation:"Computers are called smart because they can do many tasks quickly."
},

{
question:"Assertion: Computers can make mistakes. Reason: Wrong input gives wrong output.",
options:[
"Both are true and reason explains assertion",
"Both are true but reason does not explain assertion",
"Assertion is true but reason is false",
"Both are false"
],
answer:0,
explanation:"Computers give wrong results when wrong data is entered."
},

{
question:"Find the incorrect statement.",
options:[
"Computers work fast",
"Computers help store information",
"Computers get tired like humans",
"Computers are used in schools and hospitals"
],
answer:2,
explanation:"Computers do not get tired like humans."
}

];

let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 60;
let retryUsed = false;

const logoScreen = document.getElementById("logoScreen");
const introScreen = document.getElementById("introScreen");
const quizScreen = document.getElementById("quizScreen");
const resultScreen = document.getElementById("resultScreen");

const questionText = document.getElementById("questionText");
const optionsContainer = document.getElementById("optionsContainer");
const scoreText = document.getElementById("scoreText");
const timerText = document.getElementById("timerText");
const progressText = document.getElementById("progressText");
const feedback = document.getElementById("feedback");
const explanation = document.getElementById("explanation");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

setTimeout(()=>{

logoScreen.classList.remove("active");
introScreen.classList.add("active");

},5000);

function startQuiz(){

introScreen.classList.remove("active");
introScreen.style.display = "none";

quizScreen.classList.add("active");
quizScreen.style.display = "flex";

loadQuestion();

}

function loadQuestion(){

clearInterval(timer);

retryUsed = false;

feedback.innerHTML = "";
explanation.style.display = "none";

const q = questions[currentQuestion];

progressText.innerHTML =
`Question ${currentQuestion+1} / ${questions.length}`;

questionText.innerHTML =
q.question;

optionsContainer.innerHTML = "";

q.options.forEach((option,index)=>{

const btn = document.createElement("button");

btn.classList.add("option-btn");

btn.innerText = option;

btn.onclick = ()=>checkAnswer(index,btn);

optionsContainer.appendChild(btn);

});

scoreText.innerHTML = `Score: ${score}`;

timeLeft = 60;

timerText.innerHTML = `Time: ${timeLeft}`;

timer = setInterval(()=>{

timeLeft--;

timerText.innerHTML = `Time: ${timeLeft}`;

if(timeLeft<=0){

clearInterval(timer);
showCorrectAnswer();

}

},1000);

}

function checkAnswer(selected,button){

const q = questions[currentQuestion];

const buttons = document.querySelectorAll(".option-btn");

if(selected === q.answer){

clearInterval(timer);

button.classList.add("correct");

feedback.innerHTML = "✅ Correct!";
feedback.style.color = "green";

correctSound.play();

score++;

createConfetti();

buttons.forEach(btn=>btn.disabled=true);

setTimeout(()=>{
nextQuestion();
},1500);

}else{

button.classList.add("wrong");

wrongSound.play();

showCross();

if(!retryUsed){

retryUsed = true;

feedback.innerHTML =
"❌ Try Again! One more chance.";

feedback.style.color = "#c62828";

buttons.forEach(btn=>{
btn.disabled = false;
});

button.disabled = true;

}else{

clearInterval(timer);
showCorrectAnswer();

}

}

}

function showCorrectAnswer(){

const q = questions[currentQuestion];

const buttons =
document.querySelectorAll(".option-btn");

buttons.forEach((btn,index)=>{

btn.disabled = true;

if(index === q.answer){

btn.classList.add("correct");

}

});

feedback.innerHTML = "Correct answer shown";
feedback.style.color = "#1565c0";

explanation.style.display = "block";

explanation.innerHTML =
`💡 ${q.explanation}`;

setTimeout(()=>{
nextQuestion();
},4000);

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion < questions.length){

loadQuestion();

}else{

showResult();

}

}

function showResult(){

quizScreen.classList.remove("active");
quizScreen.style.display = "none";

resultScreen.classList.add("active");
resultScreen.style.display = "flex";

document.getElementById("finalScore").innerHTML =
`${score} / ${questions.length}`;

let msg = "";

if(score >= 13){

msg = "Excellent! You know computers very well.";

}else if(score >= 9){

msg = "Very Good! Keep learning more.";

}else{

msg = "Good effort! Practice and play again.";

}

document.getElementById("message").innerHTML = msg;

}

function restartQuiz(){

currentQuestion = 0;
score = 0;

resultScreen.classList.remove("active");
resultScreen.style.display = "none";

introScreen.classList.add("active");
introScreen.style.display = "flex";

}

function createConfetti(){

for(let i=0;i<20;i++){

const confetti = document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left =
Math.random()*window.innerWidth + "px";

confetti.style.top =
Math.random()*200 + "px";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},1500);

}

}

function showCross(){

const cross = document.createElement("div");

cross.classList.add("cross");

cross.innerHTML = "✖";

cross.style.left =
Math.random()*window.innerWidth + "px";

cross.style.top =
Math.random()*window.innerHeight + "px";

document.body.appendChild(cross);

setTimeout(()=>{
cross.remove();
},1000);

}

function createBackground(){

const bg = document.getElementById("background");

for(let i=0;i<40;i++){

const star = document.createElement("div");

star.classList.add("star");

star.style.left = Math.random()*100 + "%";

star.style.animationDuration =
(5 + Math.random()*8) + "s";

star.style.animationDelay =
Math.random()*5 + "s";

bg.appendChild(star);

}

}

createBackground();

</script>

</body>
</html>
