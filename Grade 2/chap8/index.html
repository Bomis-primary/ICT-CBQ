<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenOffice Writer - 2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
overflow-x:hidden;
min-height:100vh;
background:linear-gradient(135deg,#dff6ff,#fff3cc,#f4e7ff,#e8ffe7);
position:relative;
color:#222;
}

/* BACKGROUND */

.bg-icons{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-2;
}

.icon{
position:absolute;
font-size:34px;
opacity:0.15;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{
transform:translateY(100vh) rotate(0deg);
opacity:0;
}
30%{
opacity:0.15;
}
100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#ffffffaa,transparent),
radial-gradient(circle at bottom right,#ffffff88,transparent);
z-index:-1;
}

/* SCREEN */

.screen{
display:none;
min-height:100vh;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.active{
display:flex;
flex-direction:column;
}

/* LOGO */

.logo-screen{
background:white;
z-index:99999;
}

.logo-screen img{
width:260px;
max-width:80vw;
max-height:40vh;
object-fit:contain;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.06);}
100%{transform:scale(1);}
}

/* CARD */

.card{
background:rgba(255,255,255,0.92);
padding:24px;
border-radius:28px;
max-width:950px;
width:100%;
box-shadow:0 12px 30px rgba(0,0,0,0.18);
backdrop-filter:blur(8px);
border:2px solid rgba(255,255,255,0.5);
animation:slideIn 0.5s ease;
}

@keyframes slideIn{
from{
transform:translateY(25px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

h1{
color:#1565c0;
margin-bottom:12px;
}

.info{
margin:8px 0;
font-size:1rem;
}

.topbar{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:20px;
font-weight:bold;
flex-wrap:wrap;
}

.progress{
width:100%;
height:12px;
background:#dbe9ff;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#42a5f5,#ab47bc,#26a69a);
transition:0.4s;
}

.question{
font-size:1.18rem;
line-height:1.6;
font-weight:600;
margin-bottom:20px;
}

.question-image{
width:100%;
max-width:360px;
margin:0 auto 18px;
border-radius:18px;
display:none;
box-shadow:0 6px 12px rgba(0,0,0,0.15);
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.option-btn{
padding:15px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#eef6ff,#f8ebff);
cursor:pointer;
font-size:1rem;
transition:0.3s;
font-weight:600;
color:#333;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.option-btn:hover{
transform:translateY(-3px) scale(1.02);
background:linear-gradient(135deg,#d8ecff,#ecdfff);
}

.correct{
background:#c8ffd1 !important;
border:2px solid #2e7d32;
}

.wrong{
background:#ffd6d6 !important;
border:2px solid #c62828;
animation:shake 0.4s;
}

@keyframes shake{
0%,100%{transform:translateX(0);}
25%{transform:translateX(-5px);}
75%{transform:translateX(5px);}
}

.feedback{
margin-top:16px;
font-weight:bold;
min-height:28px;
}

.explanation{
display:none;
margin-top:14px;
padding:14px;
border-radius:16px;
background:#eef7ff;
font-size:0.96rem;
line-height:1.5;
}

.main-btn{
padding:14px 28px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#1565c0,#8e24aa);
color:white;
font-size:1rem;
cursor:pointer;
margin-top:20px;
font-weight:bold;
transition:0.3s;
}

.main-btn:hover{
transform:scale(1.04);
}

/* CONFETTI */

.confetti{
position:fixed;
width:14px;
height:14px;
background:gold;
clip-path:polygon(
50% 0%,
61% 35%,
98% 35%,
68% 57%,
79% 91%,
50% 70%,
21% 91%,
32% 57%,
2% 35%,
39% 35%
);
animation:fall 1.5s linear forwards;
z-index:999;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(500px) rotate(360deg);
opacity:0;
}
}

.cross{
position:fixed;
font-size:42px;
color:red;
animation:fade 1s forwards;
z-index:999;
}

@keyframes fade{
0%{
opacity:1;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(2);
}
}

.badge{
font-size:2.8rem;
margin:15px 0;
}

/* MOBILE */

@media(max-width:768px){

.options{
grid-template-columns:1fr;
}

.question{
font-size:1rem;
}

.option-btn{
font-size:0.95rem;
padding:14px;
}

.logo-screen img{
width:200px;
}

.topbar{
flex-direction:column;
font-size:0.9rem;
}

}

</style>
</head>

<body>

<div class="bg-icons" id="bgIcons"></div>

<!-- LOGO -->

<div class="screen active logo-screen" id="logoScreen">

<img src="./assets/innovine-logo.png" alt="Innovine Logo">

<h2 style="margin-top:20px;">
Innovine Interactive Learning
</h2>

</div>

<!-- INTRO -->

<div class="screen" id="introScreen">

<div class="card">

<h1>OpenOffice Writer - 2</h1>

<p class="info"><strong>Grade:</strong> 2</p>
<p class="info"><strong>Subject:</strong> ICT</p>
<p class="info"><strong>Total Questions:</strong> 15</p>

<p style="margin-top:16px;">
Learn formatting and alignment tools in OpenOffice Writer through interactive CBQ challenges.
</p>

<button class="main-btn" onclick="startQuiz()">
Start Quiz
</button>

</div>

</div>

<!-- QUIZ -->

<div class="screen" id="quizScreen">

<div class="card">

<div class="topbar">

<div id="scoreText">Score: 0</div>

<div id="timerText">Time: 60</div>

<div id="questionCount">Question 1 / 15</div>

</div>

<div class="progress">
<div class="progress-fill" id="progressFill"></div>
</div>

<img id="questionImage" class="question-image" src="" alt="Question Image">

<div class="question" id="questionText"></div>

<div class="options" id="optionsContainer"></div>

<div class="feedback" id="feedback"></div>

<div class="explanation" id="explanation"></div>

</div>

</div>

<!-- RESULT -->

<div class="screen" id="resultScreen">

<div class="card">

<h1>Quiz Completed!</h1>

<div class="badge">🎉🏆🎉</div>

<h2 id="finalScore"></h2>

<p id="message"></p>

<button class="main-btn" onclick="restartQuiz()">
Play Again
</button>

</div>

</div>

<audio id="correctSound" src="./assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="./assets/wrong.mp3"></audio>

<script>

/* QUESTIONS */

let questions=[

{
question:"A student makes a heading the same size as the paragraph and it is not clearly visible. What should be done?",
options:["Delete text","Increase font size","Close file","Save document"],
answer:1,
explanation:"Increasing font size makes heading clear."
},

{
question:"Riya wants her important words to stand out but keeps them normal. What will happen?",
options:[
"Text becomes bigger",
"Important words may not be noticed",
"File will close",
"Text deletes"
],
answer:1,
explanation:"Formatting helps important words stand out."
},

{
question:"Aarav writes a paragraph and keeps all text on the left even for a title. What problem may occur?",
options:[
"Title looks unclear",
"File deletes",
"Text becomes bold",
"Page closes"
],
answer:0,
explanation:"Titles usually need proper alignment."
},

{
question:"A student forgets to save and closes the file after formatting text. What is the result?",
options:[
"Work is saved",
"Work may be lost",
"Work prints",
"Text becomes bold"
],
answer:1,
explanation:"Unsaved work may be lost."
},

{
question:"Meera underlines too many words in her paragraph. What is the likely effect?",
options:[
"Text becomes clear",
"Important words are hard to identify",
"File deletes",
"Text becomes bigger"
],
answer:1,
explanation:"Too much formatting reduces clarity."
},

{
question:"A child aligns text randomly in one paragraph. What will happen?",
options:[
"Text looks neat",
"Text looks unorganized",
"File saves automatically",
"Text becomes bold"
],
answer:1,
explanation:"Random alignment makes text messy."
},

{
question:"Sia increases font size and uses bold for headings. How does this help the reader?",
options:[
"Makes text confusing",
"Makes important parts easy to see",
"Deletes text",
"Changes color"
],
answer:1,
explanation:"Formatting improves readability."
},

{
question:"A student writes a paragraph but does not align it properly. What is the best improvement step?",
options:[
"Delete text",
"Align text properly",
"Close file",
"Save only"
],
answer:1,
explanation:"Alignment arranges text neatly."
},

{
question:"Which tool helps arrange text neatly?",
options:[
"Bold",
"Underline",
"Alignment",
"Font size"
],
answer:2,
explanation:"Alignment organizes text neatly."
},

{
question:"Which action causes messy text?",
options:[
"Bold",
"Increase font",
"Wrong alignment",
"Save"
],
answer:2,
explanation:"Wrong alignment makes text messy."
},

{
question:"A screen shows a neatly centered heading and aligned paragraph. What happens if alignment is removed?",
image:"https://dummyimage.com/400x180/42a5f5/ffffff&text=CENTER+HEADING",
options:[
"Text becomes neat",
"Text becomes messy",
"Text becomes bold",
"Text deletes"
],
answer:1,
explanation:"Alignment keeps text organized."
},

{
question:"A screen shows all text underlined making it hard to read. What is the problem?",
image:"https://dummyimage.com/400x180/ab47bc/ffffff&text=UNDERLINED+TEXT",
options:[
"Too much formatting",
"No formatting",
"Text deleted",
"Alignment issue"
],
answer:0,
explanation:"Too much formatting affects readability."
},

{
question:"Assertion: Formatting improves readability. Reason: It helps organize and highlight text.",
options:[
"Both correct and reason explains",
"Both correct but not related",
"Assertion correct, reason wrong",
"Both wrong"
],
answer:0,
explanation:"Formatting organizes and highlights text."
},

{
question:"Assertion: Saving document is necessary after formatting. Reason: Changes are kept for later use.",
options:[
"Both correct and reason explains",
"Both correct but not related",
"Assertion correct, reason wrong",
"Both wrong"
],
answer:0,
explanation:"Saving stores all formatting changes."
},

{
question:"Which statement is incorrect?",
options:[
"Bold highlights text",
"Alignment arranges text",
"Formatting deletes text",
"Font size changes text size"
],
answer:2,
explanation:"Formatting changes appearance, not delete text."
}

];

/* SHUFFLE */

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;

}

function shuffleOptions(){

questions.forEach(q=>{

const correct=q.options[q.answer];

q.options=shuffleArray([...q.options]);

q.answer=q.options.indexOf(correct);

});

}

/* VARIABLES */

let currentQuestion=0;
let score=0;
let timer;
let timeLeft=60;
let retryUsed=false;

const logoScreen=document.getElementById("logoScreen");
const introScreen=document.getElementById("introScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");

const questionText=document.getElementById("questionText");
const optionsContainer=document.getElementById("optionsContainer");
const scoreText=document.getElementById("scoreText");
const timerText=document.getElementById("timerText");
const feedback=document.getElementById("feedback");
const explanation=document.getElementById("explanation");
const progressFill=document.getElementById("progressFill");
const questionImage=document.getElementById("questionImage");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

/* LOGO */

window.onload=function(){

logoScreen.style.display="flex";

setTimeout(()=>{

logoScreen.style.display="none";

introScreen.style.display="flex";

},5000);

};

/* START */

function startQuiz(){

questions=shuffleArray(questions);

shuffleOptions();

introScreen.style.display="none";

quizScreen.style.display="flex";

currentQuestion=0;
score=0;

loadQuestion();

}

/* LOAD */

function loadQuestion(){

clearInterval(timer);

retryUsed=false;

feedback.innerHTML="";
explanation.style.display="none";

const q=questions[currentQuestion];

questionText.innerHTML=
`Q${currentQuestion+1}. ${q.question}`;

document.getElementById("questionCount").innerHTML=
`Question ${currentQuestion+1} / ${questions.length}`;

progressFill.style.width=
`${((currentQuestion)/questions.length)*100}%`;

if(q.image){

questionImage.src=q.image;
questionImage.style.display="block";

}else{

questionImage.style.display="none";

}

optionsContainer.innerHTML="";

q.options.forEach((option,index)=>{

const btn=document.createElement("button");

btn.classList.add("option-btn");

btn.innerHTML=option;

btn.onclick=()=>checkAnswer(index,btn);

optionsContainer.appendChild(btn);

});

scoreText.innerHTML=`Score: ${score}`;

timeLeft=60;

timerText.innerHTML=`Time: ${timeLeft}`;

timer=setInterval(()=>{

timeLeft--;

timerText.innerHTML=`Time: ${timeLeft}`;

if(timeLeft<=0){

clearInterval(timer);

showCorrectAnswer();

}

},1000);

}

/* CHECK */

function checkAnswer(selected,button){

const q=questions[currentQuestion];

const buttons=document.querySelectorAll(".option-btn");

if(selected===q.answer){

clearInterval(timer);

button.classList.add("correct");

feedback.innerHTML="✅ Correct!";

feedback.style.color="green";

correctSound.play();

score++;

createConfetti();

buttons.forEach(btn=>btn.disabled=true);

setTimeout(()=>{

nextQuestion();

},1500);

}else{

button.classList.add("wrong");

wrongSound.play();

showCross();

if(!retryUsed){

retryUsed=true;

feedback.innerHTML=
"❌ Try Again! One more chance.";

feedback.style.color="#c62828";

button.disabled=true;

}else{

clearInterval(timer);

showCorrectAnswer();

}

}

}

/* SHOW CORRECT */

function showCorrectAnswer(){

const q=questions[currentQuestion];

const buttons=
document.querySelectorAll(".option-btn");

buttons.forEach((btn,index)=>{

btn.disabled=true;

if(index===q.answer){

btn.classList.add("correct");

}

});

feedback.innerHTML="Correct answer shown";

feedback.style.color="#1565c0";

explanation.style.display="block";

explanation.innerHTML=
`💡 ${q.explanation}`;

setTimeout(()=>{

nextQuestion();

},3500);

}

/* NEXT */

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}else{

showResult();

}

}

/* RESULT */

function showResult(){

quizScreen.style.display="none";

resultScreen.style.display="flex";

document.getElementById("finalScore").innerHTML=
`Your Score: ${score} / ${questions.length}`;

let msg="";

if(score>=13){

msg="🌟 Excellent Formatting Champion!";

}else if(score>=9){

msg="👍 Very Good Work!";

}else{

msg="😊 Keep Practicing Formatting Skills!";

}

document.getElementById("message").innerHTML=msg;

}

/* RESTART */

function restartQuiz(){

questions=shuffleArray(questions);

shuffleOptions();

currentQuestion=0;
score=0;

resultScreen.style.display="none";

introScreen.style.display="flex";

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<24;i++){

const confetti=document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left=
Math.random()*window.innerWidth+"px";

confetti.style.top=
Math.random()*150+"px";

document.body.appendChild(confetti);

setTimeout(()=>{

confetti.remove();

},1500);

}

}

/* WRONG */

function showCross(){

const cross=document.createElement("div");

cross.classList.add("cross");

cross.innerHTML="✖";

cross.style.left=
Math.random()*window.innerWidth+"px";

cross.style.top=
Math.random()*window.innerHeight+"px";

document.body.appendChild(cross);

setTimeout(()=>{

cross.remove();

},1000);

}

/* BACKGROUND */

function createIcons(){

const bg=document.getElementById("bgIcons");

const icons=["⌨️","📝","📄","💻","✏️","📚","🔤","🖥️"];

for(let i=0;i<35;i++){

const icon=document.createElement("div");

icon.classList.add("icon");

icon.innerHTML=
icons[Math.floor(Math.random()*icons.length)];

icon.style.left=Math.random()*100+"%";

icon.style.animationDuration=
(8+Math.random()*10)+"s";

icon.style.animationDelay=
Math.random()*5+"s";

icon.style.fontSize=
(24+Math.random()*25)+"px";

bg.appendChild(icon);

}

}

createIcons();

</script>

</body>
</html>
