<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to OpenOffice Writer - 1</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
overflow-x:hidden;
min-height:100vh;
background:linear-gradient(135deg,#dff6ff,#fff5cc,#e7ffe7,#ffe3f3);
position:relative;
color:#222;
}

/* BACKGROUND */

.bg-icons{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-2;
}

.icon{
position:absolute;
font-size:35px;
opacity:0.15;
animation:floatUp linear infinite;
}

@keyframes floatUp{
0%{
transform:translateY(100vh) rotate(0deg);
opacity:0;
}
30%{
opacity:0.15;
}
100%{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at top left,#ffffffaa,transparent),
radial-gradient(circle at bottom right,#ffffff88,transparent);
z-index:-1;
}

/* SCREEN */

.screen{
display:none;
min-height:100vh;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.active{
display:flex;
flex-direction:column;
}

/* LOGO */

.logo-screen{
background:white;
z-index:9999;
}

.logo-screen img{
width:260px;
max-width:80vw;
max-height:40vh;
object-fit:contain;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* CARD */

.card{
background:rgba(255,255,255,0.92);
padding:24px;
border-radius:28px;
max-width:950px;
width:100%;
box-shadow:0 12px 28px rgba(0,0,0,0.18);
backdrop-filter:blur(8px);
border:2px solid rgba(255,255,255,0.5);
animation:slideIn 0.5s ease;
}

@keyframes slideIn{
from{
transform:translateY(25px);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

h1{
color:#1565c0;
margin-bottom:10px;
}

.info{
margin:8px 0;
font-size:1rem;
}

.topbar{
display:flex;
justify-content:space-between;
gap:10px;
margin-bottom:20px;
font-weight:bold;
flex-wrap:wrap;
}

.progress{
width:100%;
height:12px;
background:#dbe9ff;
border-radius:20px;
overflow:hidden;
margin-bottom:20px;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#42a5f5,#ab47bc,#26a69a);
transition:0.4s;
}

.question{
font-size:1.15rem;
line-height:1.6;
font-weight:600;
margin-bottom:18px;
}

.question-image{
width:100%;
max-width:350px;
margin:0 auto 18px;
border-radius:20px;
box-shadow:0 5px 12px rgba(0,0,0,0.12);
display:none;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
}

.option-btn{
padding:15px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#eef6ff,#f6ecff);
cursor:pointer;
font-size:1rem;
transition:0.3s;
font-weight:600;
color:#333;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.option-btn:hover{
transform:translateY(-3px) scale(1.02);
background:linear-gradient(135deg,#d8ecff,#ecdfff);
}

.correct{
background:#c8ffd1 !important;
border:2px solid #2e7d32;
}

.wrong{
background:#ffd6d6 !important;
border:2px solid #c62828;
animation:shake 0.4s;
}

@keyframes shake{
0%,100%{transform:translateX(0);}
25%{transform:translateX(-5px);}
75%{transform:translateX(5px);}
}

.feedback{
margin-top:16px;
font-weight:bold;
min-height:28px;
}

.explanation{
display:none;
margin-top:14px;
padding:14px;
border-radius:16px;
background:#eef7ff;
font-size:0.96rem;
line-height:1.5;
}

.main-btn{
padding:14px 28px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#1565c0,#8e24aa);
color:white;
font-size:1rem;
cursor:pointer;
margin-top:20px;
font-weight:bold;
transition:0.3s;
}

.main-btn:hover{
transform:scale(1.04);
}

/* CONFETTI */

.confetti{
position:fixed;
width:14px;
height:14px;
background:gold;
clip-path:polygon(
50% 0%,
61% 35%,
98% 35%,
68% 57%,
79% 91%,
50% 70%,
21% 91%,
32% 57%,
2% 35%,
39% 35%
);
animation:fall 1.5s linear forwards;
z-index:999;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(500px) rotate(360deg);
opacity:0;
}
}

.cross{
position:fixed;
font-size:42px;
color:red;
animation:fade 1s forwards;
z-index:999;
}

@keyframes fade{
0%{
opacity:1;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(2);
}
}

.badge{
font-size:2.8rem;
margin:15px 0;
}

/* MOBILE */

@media(max-width:768px){

.options{
grid-template-columns:1fr;
}

.question{
font-size:1rem;
}

.option-btn{
font-size:0.95rem;
padding:14px;
}

.logo-screen img{
width:200px;
}

.topbar{
flex-direction:column;
font-size:0.9rem;
}

}

</style>
</head>

<body>

<div class="bg-icons" id="bgIcons"></div>

<!-- LOGO -->

<div class="screen active logo-screen" id="logoScreen">

<img src="./assets/innovine-logo.png" alt="Innovine Logo">

<h2 style="margin-top:20px;">
Innovine Interactive Learning
</h2>

</div>

<!-- INTRO -->

<div class="screen" id="introScreen">

<div class="card">

<h1>Introduction to OpenOffice Writer - 1</h1>

<p class="info"><strong>Grade:</strong> 2</p>
<p class="info"><strong>Subject:</strong> ICT</p>
<p class="info"><strong>Total Questions:</strong> 20</p>

<p style="margin-top:16px;">
Learn typing, formatting and editing in OpenOffice Writer through fun image-based CBQ questions.
</p>

<button class="main-btn" onclick="startQuiz()">
Start Quiz
</button>

</div>

</div>

<!-- QUIZ -->

<div class="screen" id="quizScreen">

<div class="card">

<div class="topbar">

<div id="scoreText">Score: 0</div>

<div id="timerText">Time: 60</div>

<div id="questionCount">Question 1 / 20</div>

</div>

<div class="progress">
<div class="progress-fill" id="progressFill"></div>
</div>

<img id="questionImage" class="question-image" src="" alt="Question Image">

<div class="question" id="questionText"></div>

<div class="options" id="optionsContainer"></div>

<div class="feedback" id="feedback"></div>

<div class="explanation" id="explanation"></div>

</div>

</div>

<!-- RESULT -->

<div class="screen" id="resultScreen">

<div class="card">

<h1>Quiz Completed!</h1>

<div class="badge">🎉🏆🎉</div>

<h2 id="finalScore"></h2>

<p id="message"></p>

<button class="main-btn" onclick="restartQuiz()">
Play Again
</button>

</div>

</div>

<audio id="correctSound" src="./assets/correct-1.mp3"></audio>
<audio id="wrongSound" src="./assets/wrong.mp3"></audio>

<script>

/* QUESTIONS */

let questions=[

{
question:"A student opens Writer and starts typing a story. What is this action called?",
options:["Drawing","Typing text","Coloring","Printing"],
answer:1,
explanation:"Typing text means writing using keyboard."
},

{
question:"Riya types a sentence but makes a spelling mistake. What should she do?",
options:["Ignore it","Edit and correct it","Close file","Print"],
answer:1,
explanation:"Editing helps correct mistakes."
},

{
question:"Aarav wants to save his work so he can use it later. What should he do?",
options:["Close file","Save document","Delete text","Undo"],
answer:1,
explanation:"Save stores the document safely."
},

{
question:"A student wants to start writing in a new document. What should be done?",
options:["Open new document","Print file","Close Writer","Delete file"],
answer:0,
explanation:"A new document is needed to start fresh work."
},

{
question:"Meera wants to make her text bigger and clear. What should she change?",
options:["Color only","Font size","Delete text","Save file"],
answer:1,
explanation:"Font size changes text size."
},

{
question:"A child closes Writer without saving work. What will happen?",
options:["Work is saved automatically","Work may be lost","Work is printed","Work is copied"],
answer:1,
explanation:"Unsaved work can be lost."
},

{
question:"Why is the heading easy to read?",
image:"https://dummyimage.com/400x180/4285f4/ffffff&text=BIG+HEADING",
options:["Small font","Bigger font size","Wrong alignment","Deleted text"],
answer:1,
explanation:"Large font size makes heading easy to read."
},

{
question:"Which formatting tool can make important words stand out?",
image:"https://dummyimage.com/400x180/ab47bc/ffffff&text=BOLD+TEXT",
options:["Bold","Save","Print","Close"],
answer:0,
explanation:"Bold makes text darker and important."
},

{
question:"Which alignment is used for the title?",
image:"https://dummyimage.com/400x180/26a69a/ffffff&text=CENTER+TITLE",
options:["Left","Right","Center","None"],
answer:2,
explanation:"Centered text stays in middle."
},

{
question:"Which formatting style is shown in the picture?",
image:"https://dummyimage.com/400x180/ff7043/ffffff&text=UNDERLINE",
options:["Bold","Italics","Underline","Alignment"],
answer:2,
explanation:"Underline draws line below text."
},

{
question:"What type of alignment is shown?",
image:"https://dummyimage.com/400x180/5c6bc0/ffffff&text=LEFT+ALIGNMENT",
options:["Left Alignment","Center Alignment","Right Alignment","Bold"],
answer:0,
explanation:"Text aligned to left side."
},

{
question:"Action → Purpose\nTyping → Write text\nSave → Store file\nEdit → Correct text\nWhich action is used to correct mistakes?",
options:["Typing","Save","Edit","Print"],
answer:2,
explanation:"Edit helps correct mistakes."
},

{
question:"Tool → Function\nFont size → Change size\nBold → Make text dark\nSave → Store file\nWhich tool makes text bigger?",
options:["Bold","Font size","Save","Edit"],
answer:1,
explanation:"Font size increases text size."
},

{
question:"A screen shows blinking cursor ready to type text. What is happening?",
options:["Printing","Typing","Coloring","Saving"],
answer:1,
explanation:"Blinking cursor means typing can begin."
},

{
question:"A screen shows text becoming bigger after selecting an option. What action is this?",
options:["Deleting","Formatting","Printing","Closing"],
answer:1,
explanation:"Formatting changes appearance of text."
},

{
question:"Assertion: Saving a document is important.\nReason: It helps keep the work for future use.",
options:[
"Both correct and reason explains",
"Both correct but not related",
"Assertion correct, reason wrong",
"Both wrong"
],
answer:0,
explanation:"Saving keeps work safe for later."
},

{
question:"Assertion: Editing helps improve text.\nReason: It allows correcting mistakes.",
options:[
"Both correct and reason explains",
"Both correct but not related",
"Assertion correct, reason wrong",
"Both wrong"
],
answer:0,
explanation:"Editing improves text."
},

{
question:"Which statement is incorrect?",
options:[
"Typing is used to write text",
"Save stores document",
"Closing saves automatically always",
"Editing corrects text"
],
answer:2,
explanation:"Closing without saving may lose work."
}

];

/* SHUFFLE */

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;

}

function shuffleOptions(){

questions.forEach(q=>{

const correct=q.options[q.answer];

q.options=shuffleArray([...q.options]);

q.answer=q.options.indexOf(correct);

});

}

/* VARIABLES */

let currentQuestion=0;
let score=0;
let timer;
let timeLeft=60;
let retryUsed=false;

const logoScreen=document.getElementById("logoScreen");
const introScreen=document.getElementById("introScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");

const questionText=document.getElementById("questionText");
const optionsContainer=document.getElementById("optionsContainer");
const scoreText=document.getElementById("scoreText");
const timerText=document.getElementById("timerText");
const feedback=document.getElementById("feedback");
const explanation=document.getElementById("explanation");
const progressFill=document.getElementById("progressFill");
const questionImage=document.getElementById("questionImage");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

/* LOGO */

window.onload=function(){

logoScreen.style.display="flex";

setTimeout(()=>{

logoScreen.style.display="none";

introScreen.style.display="flex";

},5000);

};

/* START */

function startQuiz(){

questions=shuffleArray(questions);

shuffleOptions();

introScreen.style.display="none";

quizScreen.style.display="flex";

currentQuestion=0;
score=0;

loadQuestion();

}

/* LOAD */

function loadQuestion(){

clearInterval(timer);

retryUsed=false;

feedback.innerHTML="";
explanation.style.display="none";

const q=questions[currentQuestion];

questionText.innerHTML=
`Q${currentQuestion+1}. ${q.question}`;

document.getElementById("questionCount").innerHTML=
`Question ${currentQuestion+1} / ${questions.length}`;

progressFill.style.width=
`${((currentQuestion)/questions.length)*100}%`;

if(q.image){

questionImage.src=q.image;
questionImage.style.display="block";

}else{

questionImage.style.display="none";

}

optionsContainer.innerHTML="";

q.options.forEach((option,index)=>{

const btn=document.createElement("button");

btn.classList.add("option-btn");

btn.innerHTML=option;

btn.onclick=()=>checkAnswer(index,btn);

optionsContainer.appendChild(btn);

});

scoreText.innerHTML=`Score: ${score}`;

timeLeft=60;

timerText.innerHTML=`Time: ${timeLeft}`;

timer=setInterval(()=>{

timeLeft--;

timerText.innerHTML=`Time: ${timeLeft}`;

if(timeLeft<=0){

clearInterval(timer);

showCorrectAnswer();

}

},1000);

}

/* CHECK */

function checkAnswer(selected,button){

const q=questions[currentQuestion];

const buttons=document.querySelectorAll(".option-btn");

if(selected===q.answer){

clearInterval(timer);

button.classList.add("correct");

feedback.innerHTML="✅ Correct!";

feedback.style.color="green";

correctSound.play();

score++;

createConfetti();

buttons.forEach(btn=>btn.disabled=true);

setTimeout(()=>{

nextQuestion();

},1500);

}else{

button.classList.add("wrong");

wrongSound.play();

showCross();

if(!retryUsed){

retryUsed=true;

feedback.innerHTML=
"❌ Try Again! One more chance.";

feedback.style.color="#c62828";

button.disabled=true;

}else{

clearInterval(timer);

showCorrectAnswer();

}

}

}

/* CORRECT ANSWER */

function showCorrectAnswer(){

const q=questions[currentQuestion];

const buttons=
document.querySelectorAll(".option-btn");

buttons.forEach((btn,index)=>{

btn.disabled=true;

if(index===q.answer){

btn.classList.add("correct");

}

});

feedback.innerHTML="Correct answer shown";

feedback.style.color="#1565c0";

explanation.style.display="block";

explanation.innerHTML=
`💡 ${q.explanation}`;

setTimeout(()=>{

nextQuestion();

},3500);

}

/* NEXT */

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}else{

showResult();

}

}

/* RESULT */

function showResult(){

quizScreen.style.display="none";

resultScreen.style.display="flex";

document.getElementById("finalScore").innerHTML=
`Your Score: ${score} / ${questions.length}`;

let msg="";

if(score>=16){

msg="🌟 Excellent Writer Champion!";

}else if(score>=10){

msg="👍 Very Good Work!";

}else{

msg="😊 Keep Practicing Writer Skills!";

}

document.getElementById("message").innerHTML=msg;

}

/* RESTART */

function restartQuiz(){

questions=shuffleArray(questions);

shuffleOptions();

currentQuestion=0;
score=0;

resultScreen.style.display="none";

introScreen.style.display="flex";

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<24;i++){

const confetti=document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left=
Math.random()*window.innerWidth+"px";

confetti.style.top=
Math.random()*150+"px";

document.body.appendChild(confetti);

setTimeout(()=>{

confetti.remove();

},1500);

}

}

/* CROSS */

function showCross(){

const cross=document.createElement("div");

cross.classList.add("cross");

cross.innerHTML="✖";

cross.style.left=
Math.random()*window.innerWidth+"px";

cross.style.top=
Math.random()*window.innerHeight+"px";

document.body.appendChild(cross);

setTimeout(()=>{

cross.remove();

},1000);

}

/* BACKGROUND */

function createIcons(){

const bg=document.getElementById("bgIcons");

const icons=["⌨️","📝","📄","💻","✏️","📚","🖥️","🔤"];

for(let i=0;i<35;i++){

const icon=document.createElement("div");

icon.classList.add("icon");

icon.innerHTML=
icons[Math.floor(Math.random()*icons.length)];

icon.style.left=Math.random()*100+"%";

icon.style.animationDuration=
(8+Math.random()*10)+"s";

icon.style.animationDelay=
Math.random()*5+"s";

icon.style.fontSize=
(24+Math.random()*25)+"px";

bg.appendChild(icon);

}

}

createIcons();

</script>

</body>
</html>
