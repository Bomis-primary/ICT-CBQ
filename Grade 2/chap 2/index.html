<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun with MS Paint - 1</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:url('assets/bg.png') no-repeat center center fixed;
background-size:cover;
overflow-x:hidden;
min-height:100vh;
position:relative;
color:#222;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.80);
z-index:-1;
}

.background{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:0;
pointer-events:none;
}

.star{
position:absolute;
width:5px;
height:5px;
background:white;
border-radius:50%;
opacity:0.8;
animation:floatStars linear infinite;
}

@keyframes floatStars{
0%{
transform:translateY(100vh);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-10vh);
opacity:0;
}
}

.screen{
display:none;
position:relative;
z-index:2;
min-height:100vh;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
}

.active{
display:flex;
flex-direction:column;
}

.card{
background:#ffffffee;
padding:24px;
border-radius:24px;
max-width:850px;
width:100%;
box-shadow:0 10px 25px rgba(0,0,0,0.18);
border:2px solid #dbe9ff;
backdrop-filter:blur(5px);
}

.logo-screen{
background:white;
z-index:99999;
}

.logo-screen img{
width:220px;
max-width:90%;
display:block;
margin:auto;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

h1{
color:#1565c0;
margin-bottom:10px;
}

.info{
margin:8px 0;
font-size:1rem;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:18px;
font-weight:bold;
font-size:1rem;
gap:10px;
}

.question{
font-size:1.15rem;
line-height:1.6;
font-weight:600;
margin-bottom:20px;
}

.options{
display:grid;
gap:12px;
}

.option-btn{
padding:14px;
border:none;
border-radius:14px;
background:#eef6ff;
cursor:pointer;
font-size:1rem;
transition:0.3s;
font-weight:500;
}

.option-btn:hover{
background:#d8ecff;
transform:scale(1.02);
}

.correct{
background:#d4ffd4 !important;
border:2px solid #2e7d32;
}

.wrong{
background:#ffd9d9 !important;
border:2px solid #c62828;
}

.feedback{
margin-top:15px;
font-weight:bold;
min-height:28px;
}

.explanation{
margin-top:12px;
background:#eef7ff;
padding:12px;
border-radius:12px;
display:none;
font-size:0.95rem;
line-height:1.5;
}

.main-btn{
padding:12px 24px;
margin-top:18px;
border:none;
background:#1565c0;
color:white;
font-size:1rem;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.main-btn:hover{
background:#0d47a1;
}

.confetti{
position:fixed;
width:14px;
height:14px;
background:gold;
clip-path:polygon(
50% 0%,
61% 35%,
98% 35%,
68% 57%,
79% 91%,
50% 70%,
21% 91%,
32% 57%,
2% 35%,
39% 35%
);
animation:fall 1.5s linear forwards;
z-index:999;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(500px) rotate(360deg);
opacity:0;
}
}

.cross{
position:fixed;
font-size:42px;
color:red;
animation:fade 1s forwards;
z-index:999;
}

@keyframes fade{
0%{
opacity:1;
transform:scale(1);
}
100%{
opacity:0;
transform:scale(2);
}
}

.badge{
font-size:2.2rem;
margin:15px 0;
}

@media(max-width:600px){

.question{
font-size:1rem;
}

.option-btn{
font-size:0.95rem;
padding:12px;
}

.topbar{
flex-direction:column;
font-size:0.9rem;
}

.logo-screen img{
width:180px;
}

}

</style>
</head>

<body>

<div class="background" id="background"></div>

<!-- LOGO SCREEN -->

<div class="screen active logo-screen" id="logoScreen">

<img src="./assets/innovine-logo.png" alt="Innovine Logo">

<h2 style="margin-top:20px;">
Innovine Interactive Learning
</h2>

</div>

<!-- INTRO -->

<div class="screen" id="introScreen">

<div class="card">

<h1>Fun with MS Paint - 1</h1>

<p class="info"><strong>Grade:</strong> 2</p>
<p class="info"><strong>Subject:</strong> ICT</p>
<p class="info"><strong>Total Questions:</strong> 17</p>

<p style="margin-top:15px;">
Learn MS Paint tools through fun competency-based questions.
</p>

<button class="main-btn" onclick="startQuiz()">
Start Quiz
</button>

</div>

</div>

<!-- QUIZ -->

<div class="screen" id="quizScreen">

<div class="card">

<div class="topbar">

<div id="scoreText">Score: 0</div>

<div id="timerText">Time: 60</div>

</div>

<div class="question" id="questionText"></div>

<div class="options" id="optionsContainer"></div>

<div class="feedback" id="feedback"></div>

<div class="explanation" id="explanation"></div>

</div>

</div>

<!-- RESULT -->

<div class="screen" id="resultScreen">

<div class="card">

<h1>Quiz Completed!</h1>

<div class="badge">🏆</div>

<h2 id="finalScore"></h2>

<p id="message"></p>

<button class="main-btn" onclick="restartQuiz()">
Play Again
</button>

</div>

</div>

<audio id="correctSound" src="./assets/correct.mp3"></audio>
<audio id="wrongSound" src="./assets/wrong.mp3"></audio>

<script>

let questions=[

{
question:"A student wants to draw a straight line in Paint. Which tool should be used?",
options:["Brush","Line tool","Eraser","Fill tool"],
answer:1,
explanation:"Line tool helps draw straight lines."
},

{
question:"Riya wants to fill color inside a shape quickly. Which tool should she use?",
options:["Pencil","Fill with color","Line","Text"],
answer:1,
explanation:"Fill with color tool fills shapes quickly."
},

{
question:"Aarav makes a mistake while drawing and wants to remove it. What should he use?",
options:["Brush","Eraser","Fill","Shape"],
answer:1,
explanation:"Eraser removes mistakes."
},

{
question:"A child uses the brush tool to draw freely. What is special about this tool?",
options:[
"Draws straight lines only",
"Draws freehand",
"Deletes shapes",
"Adds text"
],
answer:1,
explanation:"Brush tool helps draw freehand pictures."
},

{
question:"Meera wants to draw a circle. Which tool should she use?",
options:["Line","Shape tool","Fill","Text"],
answer:1,
explanation:"Shape tool helps draw perfect shapes."
},

{
question:"Look at this sequence: Select tool → Draw → Color. What is the correct order of working?",
options:[
"Draw → Color → Select",
"Select → Draw → Color",
"Color → Draw → Select",
"Draw → Select → Color"
],
answer:1,
explanation:"Correct order is Select → Draw → Color."
},

{
question:"A student selects a red color and fills a box. What action is this?",
options:["Drawing","Coloring","Erasing","Typing"],
answer:1,
explanation:"Filling color is coloring."
},

{
question:"Assertion: Brush tool is used for drawing. Reason: It helps draw freehand pictures.",
options:[
"Both correct and reason explains",
"Both correct but not related",
"Assertion correct, reason wrong",
"Both wrong"
],
answer:0,
explanation:"Brush tool helps in freehand drawing."
},

{
question:"Which does NOT belong?",
options:["Pencil","Brush","Eraser","Monitor"],
answer:3,
explanation:"Monitor is not an MS Paint drawing tool."
},

{
question:"A student wants to type his name in Paint. Which tool is used?",
options:["Brush","Text tool","Fill tool","Line tool"],
answer:1,
explanation:"Text tool is used for typing."
},

{
question:"Case: Sia draws a house, colors it, and adds her name. Which step is adding name?",
options:[
"Drawing",
"Coloring",
"Typing text",
"Erasing"
],
answer:2,
explanation:"Adding a name means typing text."
},

{
question:"Error: A student says eraser is used to fill color. What is the mistake?",
options:[
"Eraser removes drawings",
"Eraser fills color",
"Eraser draws shapes",
"Eraser types text"
],
answer:0,
explanation:"Eraser removes drawings and mistakes."
},

{
question:"A child draws using pencil tool. What kind of drawing is this?",
options:[
"Straight only",
"Freehand drawing",
"Only shapes",
"Coloring"
],
answer:1,
explanation:"Pencil tool is used for freehand drawing."
},

{
question:"A student uses shape tool to draw a rectangle. What is the benefit?",
options:[
"Free drawing",
"Perfect shape",
"Delete drawing",
"Add color only"
],
answer:1,
explanation:"Shape tool helps make perfect shapes."
},

{
question:"A student clicks color box before drawing. Why is this useful?",
options:[
"To erase",
"To choose drawing color",
"To save file",
"To close paint"
],
answer:1,
explanation:"Color box helps choose colors."
},

{
question:"A child draws a flower, colors it, and writes a name. Which is the correct order?",
options:[
"Color → Draw → Text",
"Draw → Color → Text",
"Text → Draw → Color",
"Draw → Text → Color"
],
answer:1,
explanation:"Correct order is Draw → Color → Text."
},

{
question:"A student draws wrong lines and corrects them using a tool. Which tool is used?",
options:[
"Brush",
"Eraser",
"Text",
"Fill"
],
answer:1,
explanation:"Eraser removes wrong lines."
}

];

function shuffleQuestions(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;

}

let currentQuestion=0;
let score=0;
let timer;
let timeLeft=60;
let retryUsed=false;

const logoScreen=document.getElementById("logoScreen");
const introScreen=document.getElementById("introScreen");
const quizScreen=document.getElementById("quizScreen");
const resultScreen=document.getElementById("resultScreen");

const questionText=document.getElementById("questionText");
const optionsContainer=document.getElementById("optionsContainer");
const scoreText=document.getElementById("scoreText");
const timerText=document.getElementById("timerText");
const feedback=document.getElementById("feedback");
const explanation=document.getElementById("explanation");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");

window.onload=function(){

logoScreen.style.display="flex";

setTimeout(()=>{

logoScreen.style.display="none";

introScreen.style.display="flex";

},5000);

};

function startQuiz(){

questions=shuffleQuestions(questions);

introScreen.style.display="none";

quizScreen.style.display="flex";

currentQuestion=0;

score=0;

loadQuestion();

}

function loadQuestion(){

clearInterval(timer);

retryUsed=false;

feedback.innerHTML="";

explanation.style.display="none";

const q=questions[currentQuestion];

questionText.innerHTML=
`Q${currentQuestion+1}. ${q.question}`;

optionsContainer.innerHTML="";

q.options.forEach((option,index)=>{

const btn=document.createElement("button");

btn.classList.add("option-btn");

btn.innerText=option;

btn.onclick=()=>checkAnswer(index,btn);

optionsContainer.appendChild(btn);

});

scoreText.innerHTML=`Score: ${score}`;

timeLeft=60;

timerText.innerHTML=`Time: ${timeLeft}`;

timer=setInterval(()=>{

timeLeft--;

timerText.innerHTML=`Time: ${timeLeft}`;

if(timeLeft<=0){

clearInterval(timer);

showCorrectAnswer();

}

},1000);

}

function checkAnswer(selected,button){

const q=questions[currentQuestion];

const buttons=document.querySelectorAll(".option-btn");

if(selected===q.answer){

clearInterval(timer);

button.classList.add("correct");

feedback.innerHTML="✅ Correct!";

feedback.style.color="green";

correctSound.play();

score++;

createConfetti();

buttons.forEach(btn=>btn.disabled=true);

setTimeout(()=>{

nextQuestion();

},1500);

}else{

button.classList.add("wrong");

wrongSound.play();

showCross();

if(!retryUsed){

retryUsed=true;

feedback.innerHTML=
"❌ Try Again! One more chance.";

feedback.style.color="#c62828";

buttons.forEach(btn=>{
btn.disabled=false;
});

button.disabled=true;

}else{

clearInterval(timer);

showCorrectAnswer();

}

}

}

function showCorrectAnswer(){

const q=questions[currentQuestion];

const buttons=
document.querySelectorAll(".option-btn");

buttons.forEach((btn,index)=>{

btn.disabled=true;

if(index===q.answer){

btn.classList.add("correct");

}

});

feedback.innerHTML="Correct answer shown";

feedback.style.color="#1565c0";

explanation.style.display="block";

explanation.innerHTML=
`💡 ${q.explanation}`;

setTimeout(()=>{

nextQuestion();

},3500);

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion<questions.length){

loadQuestion();

}else{

showResult();

}

}

function showResult(){

quizScreen.style.display="none";

resultScreen.style.display="flex";

document.getElementById("finalScore").innerHTML=
`Your Score: ${score} / ${questions.length}`;

let msg="";

if(score>=15){

msg="Excellent Work!";

}else if(score>=10){

msg="Very Good Job!";

}else{

msg="Good Try! Keep Practicing.";

}

document.getElementById("message").innerHTML=msg;

}

function restartQuiz(){

questions=shuffleQuestions(questions);

currentQuestion=0;

score=0;

resultScreen.style.display="none";

introScreen.style.display="flex";

}

function createConfetti(){

for(let i=0;i<20;i++){

const confetti=document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left=
Math.random()*window.innerWidth+"px";

confetti.style.top=
Math.random()*200+"px";

document.body.appendChild(confetti);

setTimeout(()=>{

confetti.remove();

},1500);

}

}

function showCross(){

const cross=document.createElement("div");

cross.classList.add("cross");

cross.innerHTML="✖";

cross.style.left=
Math.random()*window.innerWidth+"px";

cross.style.top=
Math.random()*window.innerHeight+"px";

document.body.appendChild(cross);

setTimeout(()=>{

cross.remove();

},1000);

}

function createBackground(){

const bg=document.getElementById("background");

for(let i=0;i<40;i++){

const star=document.createElement("div");

star.classList.add("star");

star.style.left=Math.random()*100+"%";

star.style.animationDuration=
(5+Math.random()*8)+"s";

star.style.animationDelay=
Math.random()*5+"s";

bg.appendChild(star);

}

}

createBackground();

</script>

</body>
</html>
