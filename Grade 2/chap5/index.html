<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title> ICT - Fun with Kid Pix 2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:url('./assets/bg.jpg') center/cover fixed;min-height:100vh}
body:before{content:'';position:fixed;inset:0;background:rgba(255,255,255,.82);z-index:-1}
.screen{display:none;min-height:100vh;justify-content:center;align-items:center;padding:20px}
.active{display:flex;flex-direction:column}
.card{background:#ffffffee;padding:24px;border-radius:20px;max-width:850px;width:100%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.logo img{width:260px}
h1{color:#1565c0;margin-bottom:10px}
.btn{background:#1565c0;color:#fff;border:none;padding:12px 24px;border-radius:10px;cursor:pointer;margin-top:15px}
.top{display:flex;justify-content:space-between;margin-bottom:15px;font-weight:bold}
.option{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;background:#eef6ff;cursor:pointer}
.correct{background:#c8f7c8!important}
.wrong{background:#ffd2d2!important}
#exp{display:none;margin-top:10px;background:#eef6ff;padding:10px;border-radius:10px}
.confetti{position:fixed;width:10px;height:10px;background:gold;animation:fall 1.5s linear forwards}
@keyframes fall{to{transform:translateY(500px) rotate(360deg);opacity:0}}
</style>
</head>
<body>

<div id="logo" class="screen active logo">
<img src="./assets/innovine-logo.png">
</div>

<div id="intro" class="screen">
<div class="card">
<h1>Fun with Kid Pix - 2</h1>
<p> ICT</p><br>
<p>Instructions:</p>
<p>Read each situation carefully. You get 2 attempts. Questions and options randomize every game.</p>
<button class="btn" onclick="startQuiz()">Start Quiz</button>
</div>
</div>

<div id="quiz" class="screen">
<div class="card">
<div class="top">
<span id="score">Score:0</span>
<span id="counter"></span>
<span id="timer">60</span>
</div>
<h3 id="q"></h3><br>
<div id="opts"></div>
<div id="msg"></div>
<div id="exp"></div>
</div>
</div>

<div id="result" class="screen">
<div class="card">
<h1>Quiz Complete</h1>
<h2 id="final"></h2>
<h3 id="badge"></h3>
<button class="btn" onclick="location.reload()">Play Again</button>
</div>
</div>

<audio id="correct" src="./assets/correct-1.mp3"></audio>
<audio id="wrong" src="./assets/wrong.mp3"></audio>

<script>
let questions=[
{q:"A child makes a mistake while drawing and wants to go back to the previous step.",o:["Redo","Undo","Save","Print"],a:"Undo",e:"Undo removes the last action."},
{q:"Riya removes a drawing by mistake and wants it back again.",o:["Undo","Redo","Eraser","Fill"],a:"Redo",e:"Redo restores the removed step."},
{q:"Aarav finishes a drawing and wants to keep it for later use.",o:["Close","Save File","Delete","Undo"],a:"Save File",e:"Saving keeps work safe."},
{q:"A student clicks Undo many times and loses work.",o:["Save","Redo","Fill","Brush"],a:"Redo",e:"Redo brings back removed steps."},
{q:"Meera wants to open a saved drawing again.",o:["New","Open","Save","Print"],a:"Open",e:"Open saved files."},
{q:"A child keeps drawing but does not save.",o:["Stays forever","May be lost","Prints","Nothing"],a:"May be lost",e:"Unsaved work can be lost."},
{q:"Why is saving important?",o:["Delete drawing","Use later","Colour faster","Print"],a:"Use later",e:"Saved files can be used later."},
{q:"Why are Undo and Redo useful together?",o:["Draw faster","Correct and restore","Colour shapes","Add text"],a:"Correct and restore",e:"They help fix mistakes."},
{q:"Which action restores the last removed step?",o:["Undo","Redo","Save","Open"],a:"Redo",e:"Redo restores."},
{q:"Which tool helps view a saved drawing?",o:["Save","Open","Undo","Redo"],a:"Open",e:"Open shows saved files."},
{q:"Backward arrow removing last step shows which tool?",o:["Redo","Undo","Save","Open"],a:"Undo",e:"Undo removes last action."},
{q:"Forward arrow bringing back removed step shows?",o:["Undo","Redo","Save","Print"],a:"Redo",e:"Redo restores action."},
{q:"Undo helps correct mistakes because...",o:["Removes last action","Prints file","Colours drawing","Opens file"],a:"Removes last action",e:"Undo removes last action."},
{q:"Saving a file is important because...",o:["Deletes work","Keeps work safe","Prints work","Closes app"],a:"Keeps work safe",e:"Saving stores work."},
{q:"Which statement is incorrect?",o:["Undo removes step","Redo restores step","Save deletes drawing","Open shows file"],a:"Save deletes drawing",e:"Save never deletes work."}
];

let idx=0,score=0,attempt=0,timerInt,time=60;

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
setTimeout(()=>{logo.style.display='none';intro.classList.add('active');},5000);

function startQuiz(){
shuffle(questions);
intro.style.display='none';
quiz.classList.add('active');
loadQ();
}

function loadQ(){
attempt=0;
document.getElementById('msg').innerHTML='';
document.getElementById('exp').style.display='none';
let q=questions[idx];
let opts=[...q.o]; shuffle(opts);
document.getElementById('q').innerText=q.q;
document.getElementById('counter').innerText=`Q ${idx+1}/${questions.length}`;
let div=document.getElementById('opts'); div.innerHTML='';
opts.forEach(v=>{
let b=document.createElement('button');
b.className='option'; b.innerText=v;
b.onclick=()=>check(v,b);
div.appendChild(b);
});
time=60; document.getElementById('timer').innerText=time;
clearInterval(timerInt);
timerInt=setInterval(()=>{time--;timer.innerText=time;if(time<=0){clearInterval(timerInt);reveal();}},1000);
}

function check(val,btn){
let q=questions[idx];
if(val===q.a){
document.getElementById('correct').play();
score++; scoreEl();
btn.classList.add('correct');
confetti();
setTimeout(nextQ,1200);
}else{
document.getElementById('wrong').play();
attempt++;
btn.classList.add('wrong');
if(attempt<2){msg.innerHTML='Try Again!';btn.disabled=true;}
else reveal();
}
}

function reveal(){
clearInterval(timerInt);
let q=questions[idx];
document.getElementById('exp').style.display='block';
document.getElementById('exp').innerHTML='Answer: <b>'+q.a+'</b><br>'+q.e;
setTimeout(nextQ,2500);
}

function nextQ(){
idx++;
if(idx<questions.length) loadQ(); else finish();
}

function finish(){
quiz.style.display='none';
result.classList.add('active');
final.innerText=`Score: ${score}/${questions.length}`;
let p=(score/questions.length)*100;
badge.innerText=p>=90?'🏆 Champion':p>=75?'🌟 Excellent':p>=50?'👍 Good Job':'📚 Keep Practising';
}

function scoreEl(){document.getElementById('score').innerText='Score:'+score;}

function confetti(){
for(let i=0;i<20;i++){
let c=document.createElement('div');
c.className='confetti';
c.style.left=Math.random()*innerWidth+'px';
document.body.appendChild(c);
setTimeout(()=>c.remove(),1500);
}
}
</script>
</body>
</html>
